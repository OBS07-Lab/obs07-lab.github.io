<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>OBS07 report</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee; --dim: #8b93a7;
    --accent: #8b7cf6; --ok: #3fb68b; --warn: #e0a84a; --bad: #e5534b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button, .button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; }
  button:hover, .button:hover { border-color: var(--accent); }
  button.primary, .button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .6; cursor: default; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 8px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
  textarea { resize: vertical; min-height: 120px; }
  a { color: var(--accent); }
  .hidden { display: none !important; }

  #box { max-width: 560px; margin: 8vh auto; padding: 28px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  .lead { color: var(--dim); margin: 6px 0 20px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: block; margin-bottom: 14px; }
  label > span { display: block; margin-bottom: 4px; font-weight: 600; }
  label > span i { font-style: normal; font-weight: 400; color: var(--dim); }
  label small { display: block; color: var(--dim); font-size: 12px; margin-top: 4px; }
  input[type=file] { padding: 5px; }
  input[type=file]::file-selector-button { font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; margin-right: 10px; cursor: pointer; }
  .at { display: flex; }
  .at b { padding: 6px 9px; border: 1px solid var(--line); border-right: 0; border-radius: 6px 0 0 6px;
    color: var(--dim); font-weight: 400; background: var(--bg); }
  .at input { border-radius: 0 6px 6px 0; }
  .hp { position: absolute; left: -9999px; width: 1px; height: 1px; }
  #captcha { margin-bottom: 14px; }
  .actions { display: flex; align-items: center; gap: 12px; }
  .actions button { flex: none; }
  #error { flex: 1; color: var(--bad); min-height: 1.4em; }
  #done h1 { color: var(--ok); }
  #done p { margin: 8px 0; }
  #done .join { margin: 18px 0 6px; padding: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  #done .join p { color: var(--dim); margin: 0 0 12px; }
  .button { display: inline-block; text-decoration: none; }
  #again { background: transparent; border-color: transparent; color: var(--dim); padding-left: 0; }
  @media (max-width: 620px) { #box { margin: 0; border: 0; border-radius: 0; min-height: 100vh; padding: 20px 16px; } .two { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>
<body>

<div id="box">
  <form id="form" novalidate>
    <h1>OBS07 report</h1>
    <p class="lead">Found a problem with the OBS07 shader patch, or have an idea? Tell us here, no account needed.</p>

    <div class="two">
      <label><span>Type</span><select name="type" required></select></label>
      <label><span>Game version</span><select name="version" required></select></label>
    </div>
    <label><span>Title</span>
      <input name="title" minlength="5" maxlength="100" required placeholder="Short summary"></label>
    <label><span>Details</span>
      <textarea name="details" minlength="10" maxlength="1500" required placeholder="What happens, where, which preset, steps to see it"></textarea></label>
    <label><span>Screenshots or log <i>(optional)</i></span>
      <input type="file" name="file" multiple accept=".png,.jpg,.jpeg,.webp,.gif,.log,.txt">
      <small id="file-hint"></small></label>
    <label><span>Discord username <i>(optional)</i></span>
      <div class="at"><b>@</b><input name="discord" maxlength="33" autocomplete="off" spellcheck="false" placeholder="yourname"></div>
      <small>We ping you on the OBS07 Discord when your report is fixed. You need to be on the server for that.</small></label>
    <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <div id="captcha"></div>

    <div class="actions">
      <div id="error"></div>
      <button class="primary" id="send" disabled>Send report</button>
    </div>
  </form>

  <div id="done" class="hidden">
    <h1>Thanks!</h1>
    <p id="done-text"></p>
    <div class="join">
      <p>Join the OBS07 Discord to follow your report, answer questions about it and know when it is fixed.</p>
      <a class="button primary" id="invite" target="_blank" rel="noopener noreferrer">Join the Discord</a>
    </div>
    <button id="again">Send another report</button>
  </div>
</div>

<script>
const BOT = "https://obs07-lab-bot.summaxpro.workers.dev";
const INVITE = "https://discord.gg/ZgXeQqePy3";

const $ = (s) => document.querySelector(s);
const form = $("#form"), el = form.elements, send = $("#send"), error = $("#error");
let cfg = null, captcha = null;
$("#invite").href = INVITE;

function fill(select, list, first) {
  select.innerHTML = `<option value="" disabled selected hidden>${first}</option>`;
  for (const [value, text] of Object.entries(list)) select.add(new Option(text, value));
}

async function start() {
  try {
    const res = await fetch(BOT + "/report");
    cfg = await res.json();
    if (!res.ok || !cfg.types) throw 0;
  } catch {
    error.innerHTML = `The form is not available right now. You can report on <a href="${INVITE}">Discord</a>.`;
    return;
  }
  fill(el.type, cfg.types, "What kind of report");
  fill(el.version, cfg.versions, "Your game version");
  $("#file-hint").textContent = `Up to ${cfg.maxFiles} files, ${Math.round(cfg.maxFile / 1048576)} MB each (png, jpg, webp, gif, .log, .txt)`;
  if (cfg.sitekey) {
    window.onCaptcha = () => { captcha = turnstile.render("#captcha", { sitekey: cfg.sitekey, theme: "dark" }); };
    const s = document.createElement("script");
    s.src = "https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=onCaptcha";
    document.head.append(s);
  }
  send.disabled = false;
}

// Same checks as the bot, so a mistake shows before the files are uploaded.
function problem() {
  const v = (k) => el[k].value.trim();
  if (!v("type") || !v("version")) return "Choose a type and a game version.";
  if (v("title").length < 5) return "The title is too short.";
  if (v("details").length < 10) return "Tell us a bit more in the details.";
  const files = [...el.file.files];
  if (files.length > cfg.maxFiles) return `${cfg.maxFiles} files max.`;
  if (files.some((f) => f.size > cfg.maxFile)) return `Each file must be under ${Math.round(cfg.maxFile / 1048576)} MB.`;
  if (files.some((f) => !/\.(png|jpe?g|webp|gif|log|txt)$/i.test(f.name))) return "Only screenshots (png, jpg, webp, gif) and logs (.log, .txt).";
  const name = v("discord").replace(/^@/, "");
  if (name && !/^[a-z0-9_.]{2,32}$/i.test(name)) return "That doesn't look like a Discord username (not the display name).";
  if (cfg.sitekey && !new FormData(form).get("cf-turnstile-response")) return "Please wait for the check above to finish.";
  return "";
}

form.onsubmit = async (e) => {
  e.preventDefault();
  if (!cfg) return;
  error.textContent = problem();
  if (error.textContent) return;
  send.disabled = true;
  send.textContent = "Sending...";
  try {
    const res = await fetch(BOT + "/report", { method: "POST", body: new FormData(form) });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(d.error || "Something went wrong, please try again later.");
    $("#done-text").textContent = d.merged
      ? `Someone already reported something similar, your report was added to it (${d.votes} reports).`
      : "Your report was saved. We'll look at it.";
    form.classList.add("hidden");
    $("#done").classList.remove("hidden");
    form.reset();
  } catch (err) {
    error.textContent = err instanceof TypeError ? "Could not reach the server, check your connection and try again." : err.message;
  }
  if (captcha !== null) turnstile.reset(captcha);
  send.disabled = false;
  send.textContent = "Send report";
};

$("#again").onclick = () => {
  $("#done").classList.add("hidden");
  form.classList.remove("hidden");
  error.textContent = "";
};

start();
</script>
</body>
</html>
